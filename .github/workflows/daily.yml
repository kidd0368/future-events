name: daily-update

on:
  schedule:
    - cron: '30 22 * * *'   # UTC 22:30 = 台北 06:30
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Daily fetch（排程/手動觸發時）
        if: github.event_name != 'push'
        env:
          JIN10_KEY: ${{ secrets.JIN10_KEY }}
        run: python3 scripts/fetch_auto.py || echo "fetch failed, continue with existing data"

      - name: Commit data changes
        if: github.event_name != 'push'
        run: |
          git config user.name "fe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/events.json logs/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "auto: daily fetch $(date -u +%F)"
          git push || true

      - name: Build site
        run: python3 scripts/build_site.py

      - name: Encrypt with StatiCrypt
        env:
          STATICRYPT_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
        run: |
          mkdir -p dist
          cd build
          npx -y staticrypt index.html -d ../dist --short --remember 30 \
            -c false -s c515bfb0c8e31ab811aed98e36c32f7c \
            --template-title "未來事件時間表" \
            --template-button "解鎖" \
            --template-placeholder "輸入密碼" \
            --template-remember "記住我 30 天" \
            --template-error "密碼錯誤" \
            --template-color-primary "#e8b339" \
            --template-color-secondary "#12161c"
          ls -la ../dist

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
